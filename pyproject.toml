[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocab-illustrator"
version = "1.0.0"
description = "Excel vocabulary-card illustration batch generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=2.8.0,<3",
  "openpyxl>=3.1.5,<4",
  "Pillow>=11.0.0,<13",
  "pydantic>=2.10.0,<3",
  "python-dotenv>=1.0.1,<2",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14.0,<2",
  "pytest>=8.3.0,<10",
  "pytest-asyncio>=0.25.0,<2",
  "ruff>=0.9.0,<1",
  "types-openpyxl>=3.1.5.20250919",
  "types-PyYAML>=6.0.12.20250915",
]

[project.scripts]
vocab-illustrator = "vocab_illustrator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vocab_illustrator"]

